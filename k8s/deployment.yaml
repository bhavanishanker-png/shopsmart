apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopsmart-frontend
  namespace: shopsmart-prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shopsmart-frontend
  template:
    metadata:
      labels:
        app: shopsmart-frontend
    spec:
      containers:
      - name: shopsmart-frontend
        # This image will be replaced by the CI/CD pipeline
        image: REPLACE_ME_IMAGE_URL
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
