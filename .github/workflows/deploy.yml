name: Deploy to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  PROJECT_NAME: shopsmart-v5
  ENVIRONMENT: dev

jobs:
  # ══════════════════════════════════════════════════════════════════════════
  # Phase 1 — Testing
  # ══════════════════════════════════════════════════════════════════════════
  test:
    name: Phase 1 — Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install client dependencies
        working-directory: ./client
        run: npm ci

      - name: Install server dependencies
        working-directory: ./server
        run: npm ci

      - name: Run client unit tests
        working-directory: ./client
        run: npm test -- --reporter=junit --outputFile=../test-results/client-results.xml || true

      - name: Run server unit tests
        working-directory: ./server
        run: npm test -- --reporter=junit --outputFile=../test-results/server-results.xml || true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14

  # ══════════════════════════════════════════════════════════════════════════
  # Phase 2 — Infrastructure Provisioning (Terraform)
  # ══════════════════════════════════════════════════════════════════════════
  terraform:
    name: Phase 2 — Terraform Infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test

    defaults:
      run:
        working-directory: ./terraform

    outputs:
      ecr_repository_url: ${{ steps.tf_outputs.outputs.ecr_repository_url }}
      ecs_cluster_name:   ${{ steps.tf_outputs.outputs.ecs_cluster_name }}
      ecs_service_name:   ${{ steps.tf_outputs.outputs.ecs_service_name }}
      eks_cluster_name:   ${{ steps.tf_outputs.outputs.eks_cluster_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.0'
          terraform_wrapper: false

      - name: Restore Terraform state
        uses: actions/cache/restore@v4
        with:
          path: terraform/terraform.tfstate
          key: terraform-state-v5-main-${{ github.sha }}
          restore-keys: |
            terraform-state-v5-main-

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: |
          terraform plan \
            -var="aws_region=${{ secrets.AWS_REGION }}" \
            -var="project_name=${{ env.PROJECT_NAME }}" \
            -var="environment=${{ env.ENVIRONMENT }}" \
            -input=false \
            -out=tfplan

      - name: Terraform Apply
        run: |
          terraform apply \
            -input=false \
            -auto-approve \
            tfplan

      - name: Extract Terraform outputs
        id: tf_outputs
        run: |
          # Use -json to ensure we only get the values without any Terraform warnings that could break multiline output
          terraform output -json > tf_outputs.json
          
          echo "ecr_repository_url=$(jq -r '.ecr_repository_url.value // empty' tf_outputs.json)" >> "$GITHUB_OUTPUT"
          echo "ecs_cluster_name=$(jq -r '.ecs_cluster_name.value // empty' tf_outputs.json)" >> "$GITHUB_OUTPUT"
          echo "ecs_service_name=$(jq -r '.ecs_service_name.value // empty' tf_outputs.json)" >> "$GITHUB_OUTPUT"
          echo "eks_cluster_name=$(jq -r '.eks_cluster_name.value // empty' tf_outputs.json)" >> "$GITHUB_OUTPUT"
          echo "s3_bucket_name=$(jq -r '.s3_bucket_name.value // empty' tf_outputs.json)" >> "$GITHUB_OUTPUT"
          
          echo "=== Terraform Outputs ==="
          cat tf_outputs.json

      - name: Save Terraform state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: terraform/terraform.tfstate
          key: terraform-state-v5-main-${{ github.sha }}

  # ══════════════════════════════════════════════════════════════════════════
  # Phase 3 — Container Build & Push
  # ══════════════════════════════════════════════════════════════════════════
  build-and-push:
    name: Phase 3 — Build & Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: terraform
    outputs:
      image_tag: ${{ steps.build.outputs.image_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker image
        id: build
        run: |
          IMAGE_TAG="${{ github.sha }}"
          ECR_REPO="${{ needs.terraform.outputs.ecr_repository_url }}"

          docker build \
            --tag "${ECR_REPO}:${IMAGE_TAG}" \
            --tag "${ECR_REPO}:latest" \
            --file Dockerfile \
            --cache-from type=gha \
            --cache-to   type=gha,mode=max \
            .

          docker push "${ECR_REPO}:${IMAGE_TAG}"
          docker push "${ECR_REPO}:latest"

          echo "Pushed image: ${ECR_REPO}:${IMAGE_TAG}"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

  # ══════════════════════════════════════════════════════════════════════════
  # Phase 4a — Deploy to ECS
  # ══════════════════════════════════════════════════════════════════════════
  deploy-ecs:
    name: Phase 4a — Deploy to ECS Fargate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [terraform, build-and-push]

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Get current ECS task definition
        run: |
          TASK_FAMILY="${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}"
          aws ecs describe-task-definition \
            --task-definition "${TASK_FAMILY}" \
            --query taskDefinition \
            > task-definition.json

      - name: Update task definition with new image
        id: task_def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition:   task-definition.json
          container-name:    ${{ env.PROJECT_NAME }}
          image:             ${{ needs.terraform.outputs.ecr_repository_url }}:${{ needs.build-and-push.outputs.image_tag }}

      - name: Deploy updated task definition to ECS Fargate
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition:         ${{ steps.task_def.outputs.task-definition }}
          service:                 ${{ needs.terraform.outputs.ecs_service_name }}
          cluster:                 ${{ needs.terraform.outputs.ecs_cluster_name }}
          wait-for-service-stability: true
          wait-for-minutes:        10

      - name: Verify ECS service is running
        run: |
          RUNNING=$(aws ecs describe-services \
            --cluster "${{ needs.terraform.outputs.ecs_cluster_name }}" \
            --services "${{ needs.terraform.outputs.ecs_service_name }}" \
            --query "services[0].runningCount" \
            --output text)
          if [ "${RUNNING}" -lt 1 ]; then
            echo "ERROR: No running tasks found."
            exit 1
          fi
          echo "✅ ECS service is healthy — ${RUNNING} tasks running"

  # ══════════════════════════════════════════════════════════════════════════
  # Phase 4b — Deploy to EKS
  # ══════════════════════════════════════════════════════════════════════════
  deploy-eks:
    name: Phase 4b — Deploy to Kubernetes (EKS)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [terraform, build-and-push]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ needs.terraform.outputs.eks_cluster_name }} --region ${{ secrets.AWS_REGION }}

      - name: Replace image in Kubernetes manifests
        run: |
          IMAGE="${{ needs.terraform.outputs.ecr_repository_url }}:${{ needs.build-and-push.outputs.image_tag }}"
          sed -i "s|REPLACE_ME_IMAGE_URL|$IMAGE|g" k8s/deployment.yaml

      - name: Deploy to EKS
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/shopsmart-frontend -n shopsmart-prod --timeout=5m
          kubectl get pods -n shopsmart-prod
          kubectl get svc -n shopsmart-prod
