name: Deploy To EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-ec2-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Deploy on EC2 over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: main
          TOKEN: ${{ secrets.REPO_ACCESS_TOKEN }}
          APP_DIR: ${{ vars.EC2_APP_DIR }}
          PM2_APP_NAME: ${{ vars.EC2_PM2_APP_NAME }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || '22' }}
          envs: GITHUB_REPOSITORY,DEFAULT_BRANCH,TOKEN,APP_DIR,PM2_APP_NAME
          script: |
            set -euo pipefail

            DEPLOY_DIR="${APP_DIR:-$HOME/shopsmart}"
            BRANCH="${DEFAULT_BRANCH}"
            REPO_URL="https://github.com/${GITHUB_REPOSITORY}.git"

            if [ -n "${TOKEN:-}" ]; then
              REPO_URL="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            fi

            mkdir -p "${DEPLOY_DIR}"

            if [ ! -d "${DEPLOY_DIR}/.git" ]; then
              git clone --branch "${BRANCH}" "${REPO_URL}" "${DEPLOY_DIR}"
            fi

            cd "${DEPLOY_DIR}"
            git fetch origin "${BRANCH}"
            git checkout "${BRANCH}"
            git reset --hard "origin/${BRANCH}"

            cd server
            npm ci --omit=dev

            if command -v pm2 >/dev/null 2>&1; then
              APP_NAME="${PM2_APP_NAME:-shopsmart-backend}"
              if pm2 describe "${APP_NAME}" >/dev/null 2>&1; then
                pm2 restart "${APP_NAME}" --update-env
              else
                pm2 start src/index.js --name "${APP_NAME}"
              fi
              pm2 save
            fi

            cd ../client
            npm install
            npm run build

            sudo systemctl restart nginx
