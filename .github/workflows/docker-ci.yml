name: Docker CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  docker-build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        run: docker build -t shopsmart-frontend:ci .

      - name: Run container
        run: docker run -d --name shopsmart-frontend-ci -p 8080:80 shopsmart-frontend:ci

      - name: Wait for container startup
        run: |
          for i in {1..20}; do
            if curl -fsS http://localhost:8080 >/dev/null; then
              echo "Container is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Container did not become ready in time"
          docker logs shopsmart-frontend-ci
          exit 1

      - name: Smoke test homepage
        run: curl -fsS http://localhost:8080 >/dev/null

      - name: Show container logs on failure
        if: failure()
        run: docker logs shopsmart-frontend-ci

      - name: Stop and remove container
        if: always()
        run: docker rm -f shopsmart-frontend-ci || true
