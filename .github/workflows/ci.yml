name: CI - Build Verification

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install client dependencies
        working-directory: ./client
        run: npm ci

      - name: Install server dependencies
        working-directory: ./server
        run: npm ci

      - name: Lint client
        working-directory: ./client
        run: npm run lint

      - name: Check client formatting
        working-directory: ./client
        run: npm run format:check

      - name: Lint server
        working-directory: ./server
        run: npm run lint

      - name: Check server formatting
        working-directory: ./server
        run: npm run format:check

      # ── Tests with JUnit report output ─────────────────────────────────────
      - name: Test client
        working-directory: ./client
        run: npm test -- --reporter=junit --outputFile=../test-results/client-results.xml || true

      - name: Test server
        working-directory: ./server
        run: npm test -- --reporter=junit --outputFile=../test-results/server-results.xml || true

      # ── Upload test reports as artifacts ───────────────────────────────────
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-node-${{ matrix.node-version }}
          path: test-results/
          retention-days: 14

      - name: Build project
        working-directory: ./client
        run: npm run build
